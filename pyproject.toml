[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "_build_backend"
backend-path = ["."]

[project]
name = "streamlit-listview"
version = "1.1.0"
description = "Streamlit Components V2 selectable list widget with search, groups, and theming"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Leland Grunt", email = "33732585+LelandGrunt@users.noreply.github.com" }]
keywords = [
  "streamlit",
  "streamlit-component",
  "components-v2",
  "listview",
  "list",
  "widget",
  "selection",
  "ui",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: User Interfaces",
  "Typing :: Typed",
]
dependencies = ["streamlit >= 1.51"]

[project.urls]
Homepage = "https://github.com/LelandGrunt/streamlit-listview"
Repository = "https://github.com/LelandGrunt/streamlit-listview"
Issues = "https://github.com/LelandGrunt/streamlit-listview/issues"
"Release Notes" = "https://github.com/LelandGrunt/streamlit-listview/releases"

[project.optional-dependencies]
devel = [
  "wheel",
  "pytest",
  "pytest-cov",
  "playwright",
  "pytest-playwright",
  "requests",
  "pytest-rerunfailures",
]

[tool.coverage.run]
branch = true
# push_gate, verify_wheel and smoke_wheel are scripts in scripts/, _build_backend
# the root module; the tests import each by name after a sys.path insert. The
# last three decide what a wheel ships and whether it works, so they share the
# gate.
source = [
  "streamlit_listview",
  "demo",
  "push_gate",
  "verify_wheel",
  "smoke_wheel",
  "_build_backend",
]
omit = [
  # Streamlit entry point: exercised by the Playwright e2e suite, the AppTest
  # runs in tests/test_demo_app.py and a compile smoke test, none of which
  # reaches every branch.
  "demo/app.py",
]

[tool.coverage.report]
show_missing = true
# The unit-testable surface (the listview package, the demo's pure helpers, the
# push gate, the wheel check and the build backend) is exhaustively covered;
# keep it that way. Coverage shows that a line ran, not that a test checked its
# result.
fail_under = 100

# Ruff lints with its default rule set and formats with its default style
# (line length 88). The pre-commit hook and CI run the version pinned in
# .pre-commit-config.yaml.
[tool.ruff]
# demo/ and scripts/ modules are imported by name after a sys.path insert
# (`import data`), so the import sorter counts them as first-party. Keep in
# step with [tool.ty.environment] extra-paths.
src = [".", "demo", "scripts", "scripts/gif"]

[tool.ruff.lint]
# C901 caps the cyclomatic complexity of a function at 10, the limit oxlint's
# `complexity` sets in the frontend. A function above it when the cap came in
# carries `# noqa: C901` with the reason; split it on the next change and
# remove the noqa.
extend-select = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# listview() reports every invalid argument as a ValueError, wrong types
# included: the suite matches on the messages, and a TypeError would break
# callers that catch ValueError.
"streamlit_listview/**" = ["TRY004"]
# The demo's snippet generator is tested by executing the code it emits.
"tests/test_demo.py" = ["S102"]
# The harness runs the README's recipe for on_change as a reader copies it.
"e2e/app_on_change.py" = ["S102"]

[tool.ty.environment]
# demo/ and scripts/ hold top-level modules that the tests and e2e harnesses
# import after putting the directory on sys.path (`import data`). Keep in step
# with [tool.ruff] src.
extra-paths = ["demo", "scripts", "scripts/gif"]
# Check every platform's branches, so the hook on Windows and CI on Linux
# report the same diagnostics.
python-platform = "all"

[tool.ty.rules]
# Two rules beyond ty's defaults keep Any out of typed code: a bare generic
# (`dict`, `list`) and a typed function that returns Any. Two more stay off:
# truthiness-test-of-none-union (`if name:` on `str | None` is idiomatic) and
# missing-override-decorator (@override needs typing_extensions on 3.10).
missing-type-argument = "error"
unsound-return-statement = "error"

# typos (a pre-commit hook) checks the spelling of every text file and fixes
# what it can. Accept a word here only when it is right. A public name with a
# typo (a listview() parameter, a data-testid, a demo label) stays: callers, the
# e2e suite and the GIF scenarios depend on it. Each accepted word carries its
# reason in a comment.
[tool.typos.files]
extend-exclude = ["*.lock", "package-lock.json", "assets/"]

[tool.typos.default.extend-words]
# tests/test_push_gate.py writes "Café" as "Caf\u00e9", so typos sees "Caf".
caf = "caf"

[tool.setuptools.packages.find]
include = ["streamlit_listview*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
streamlit_listview = ["frontend/build/**/*", "pyproject.toml", "py.typed"]
