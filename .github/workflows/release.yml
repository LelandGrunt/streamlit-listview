name: Release

# Publish to PyPI when a version tag (e.g. v1.2.3) is pushed, using PyPI
# Trusted Publishing (OIDC) — no API tokens are stored in the repo.
#
# One-time setup on PyPI (https://pypi.org/manage/account/publishing/):
#   add a "Trusted Publisher" for this GitHub repo with
#   workflow = "release.yml" and environment = "pypi".
# See .claude/skills/release/SKILL.md for the full checklist.

on:
  push:
    tags: ["v*.*.*"]

# Least privilege by default; each job elevates only what it needs.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & verify distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the history the check needs to compare the tag with main

      # Fail fast unless the tagged commit is a consistent release: the tag
      # names [project].version, the places that assert the version and
      # uv.lock agree, CHANGELOG.md dates the version and contains no
      # "Unreleased", PyPI lacks the version, and GitHub's main can
      # fast-forward to the tagged commit. The local pre-push hook runs the
      # same checks; this step catches a tag pushed with --no-verify.
      - name: Check the version information (push gate)
        run: python3 scripts/push_gate.py check tag "$GITHUB_REF_NAME"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: streamlit_listview/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: streamlit_listview/frontend
        run: npm ci

      # Must precede `npm test`: the vitest suite includes
      # src/__tests__/single-file-build.test.ts, which asserts on the gitignored
      # build/ directory (exactly one index-*.js / index-*.css). On a fresh
      # checkout build/ does not exist yet, so testing first fails with ENOENT
      # and no tag could ever be published.
      - name: Build frontend bundle
        working-directory: streamlit_listview/frontend
        run: npm run build

      - name: Frontend tests (vitest + coverage gate + typecheck)
        working-directory: streamlit_listview/frontend
        run: npm test

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"

      # The newest versions pyproject.toml admits, as in ci.yml.
      - name: Create venv and install (editable, dev extras)
        env:
          LISTVIEW_SKIP_NPM_BUILD: "1" # bundle already built above; don't rebuild on install
        run: |
          uv venv
          uv pip install -e ".[devel]"

      # Re-run the unit suite at the tagged commit so a release can never ship
      # code that did not pass the 100% coverage gate.
      - name: Python unit tests (100% coverage gate)
        run: .venv/bin/python -m pytest tests/ --cov --cov-report=term-missing

      - name: Build sdist + wheel
        env:
          LISTVIEW_SKIP_NPM_BUILD: "1" # publish exactly the bundle that passed tests
        run: uv build

      - name: Verify the wheel ships the frontend bundle
        run: .venv/bin/python scripts/verify_wheel.py

      - name: Check distribution metadata renders on PyPI
        run: uvx twine check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # CI's jobs on the tagged commit: every pre-commit hook (the audits and
  # gitleaks included), the unit suites with the wheel check, and the browser
  # suite in Chromium. The push gate runs them before the tag leaves the clone,
  # but a tag pushed with --no-verify skips it, ci.yml does not run on a tag,
  # and main reaches GitHub only after PyPI. PyPI never takes a version twice,
  # so publishing waits for them.
  ci:
    uses: ./.github/workflows/ci.yml

  publish-to-pypi:
    name: Publish to PyPI
    needs: [build, ci]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/streamlit-listview
    permissions:
      id-token: write # mint the OIDC token for Trusted Publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # Trusted Publishing: no username / password / API token. PEP 740 build
      # attestations are generated and uploaded by default.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Sign & create GitHub Release
    needs: publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # Sigstore signing via OIDC
    steps:
      # CHANGELOG.md, for the release notes.
      - uses: actions/checkout@v7

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Sign the distributions with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.5.0
        with:
          inputs: ./dist/*.tar.gz ./dist/*.whl

      # The notes are the version's section of CHANGELOG.md, so a release that
      # breaks compatibility says so on GitHub too; the build job's push gate
      # check guarantees the heading. It ends at the next version heading or at
      # the link definitions below the last one. Relative links point at the
      # tag, because a release page resolves them against its own URL.
      # --generate-notes appends GitHub's compare link below them. PyPI has
      # published by now, so empty notes only warn: the release still appears.
      - name: Extract the release notes from CHANGELOG.md
        run: |
          awk -v heading="## [${GITHUB_REF_NAME#v}] - " '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[.*\]: / { exit }
            found { print }
          ' CHANGELOG.md \
            | sed -E "s#\]\(([^)#:]+)\)#](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/\1)#g" \
            > "$RUNNER_TEMP/release-notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "::warning::CHANGELOG.md has no notes for ${GITHUB_REF_NAME#v}; the release shows only GitHub's generated notes."
          fi

      - name: Create the GitHub Release with signed assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # PEP 440 pre-releases (v1.2.3a1, v1.2.3b1, v1.2.3rc1) are flagged as
          # such, so GitHub's "Latest" badge stays on the last final release.
          prerelease=()
          if [[ "$GITHUB_REF_NAME" =~ (a|b|rc)[0-9]+$ ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --generate-notes \
            "${prerelease[@]}" \
            ./dist/*
