# Checks that run before every commit, and in CI on every push and pull request.
#
# Set up once per clone (worktrees share the hook):
#   uv tool install pre-commit
#   pre-commit install --allow-missing-config
# Run every check on the whole repository:
#   pre-commit run --all-files
# Move the pinned Python tool versions to their latest releases:
#   pre-commit autoupdate
#
# The Python hooks install their own pinned copy of their tool, so the local
# uv, ruff or ty version does not matter. The frontend hooks run the project's
# npm scripts with the versions in package-lock.json, so they need `npm ci` in
# streamlit_listview/frontend first.
#
# The hook checks the staged snapshot: pre-commit sets unstaged changes aside
# as a patch file (not `git stash`, whose stack the worktrees share) and
# restores them afterwards. Every worktree runs the one hook installed in the
# shared .git/hooks; --allow-missing-config lets a branch that predates this
# file still commit.
minimum_pre_commit_version: "4.4.0" # `language: unsupported`
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.85
    hooks:
      # ty checks the whole project on every commit, against the project
      # environment (uv check). --extra devel adds pytest and Playwright for the
      # test code; --no-install-project skips the editable install, which would
      # build the frontend bundle; --frozen leaves uv.lock alone. ty checks
      # against the Python version UV_PYTHON names (3.12 in CI and in the push
      # gate), else against the floor of requires-python (3.10), and
      # [tool.ty.environment] python-version does not override it. Guard an
      # import that exists only in some versions with `sys.version_info`, not
      # with an ignore comment: the comment is unused under one of the two
      # versions, and ty fails.
      - id: ty
        args: [--extra, devel, --no-install-project, --frozen]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.23
    hooks:
      # Runs only when uv.lock or pyproject.toml changes. --locked also fails
      # when uv.lock is out of date with pyproject.toml.
      - id: uv-audit
        args: [--locked, --preview-features=audit-command]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # The staged changes, before each commit.
      - id: gitleaks
      # The history of HEAD. In CI and in the push gate nothing is staged, so
      # only this hook catches a secret that a commit with --no-verify let in.
      # gitleaks is written in Go; pre-commit installs Go on its first run.
      - id: gitleaks
        alias: gitleaks-history
        name: gitleaks (history of HEAD)
        entry: gitleaks git --redact --verbose --log-opts=HEAD
        pass_filenames: false
        always_run: true

  - repo: https://github.com/crate-ci/typos
    rev: v1.50.3
    hooks:
      # Fixes what it can (--write-changes): stage the file and commit again.
      # Its exceptions live under [tool.typos] in pyproject.toml.
      - id: typos

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      # Checks only: fix the document by hand. The rules live in
      # .markdownlint-cli2.jsonc.
      - id: markdownlint-cli2

  # Checks the links of every Markdown file, by hand: the result depends on
  # other websites, so no commit, CI run or push waits for it. Run it with
  # pre-commit run --hook-stage manual markdown-link-check --all-files
  - repo: https://github.com/tcort/markdown-link-check
    rev: v3.15.0
    hooks:
      - id: markdown-link-check
        args: [--config, .markdown-link-check.json, --quiet]
        stages: [manual]

  - repo: local
    hooks:
      # Without node_modules the hooks below fail with a bare "command not
      # found"; this hook runs first and names the fix.
      - id: frontend-deps
        name: node_modules (frontend)
        entry: node -e "require('fs').existsSync('streamlit_listview/frontend/node_modules') || (console.error('streamlit_listview/frontend/node_modules is missing. Run npm ci in streamlit_listview/frontend, then commit again.'), process.exit(1))"
        language: unsupported
        files: ^streamlit_listview/frontend/
        pass_filenames: false
      # tsc checks the app code (as `npm run build` does) and the tests (as
      # `npm test` does).
      - id: tsc
        name: tsc (frontend)
        entry: npm --prefix streamlit_listview/frontend run --silent typecheck:all
        language: unsupported
        files: ^streamlit_listview/frontend/
        types_or: [ts, tsx, json]
        pass_filenames: false
      - id: oxlint
        name: oxlint (frontend)
        entry: npm --prefix streamlit_listview/frontend run --silent lint
        language: unsupported
        files: ^streamlit_listview/frontend/
        types_or: [ts, tsx, json]
        pass_filenames: false
      # Checks only; `npm run format` in streamlit_listview/frontend fixes. It
      # is the one hook that checks listview.css.
      - id: prettier
        name: prettier --check (frontend)
        entry: npm --prefix streamlit_listview/frontend run --silent format:check
        language: unsupported
        files: ^streamlit_listview/frontend/
        types_or: [ts, tsx, json, css]
        pass_filenames: false
      # Runs only when package.json or package-lock.json changes.
      - id: npm-audit
        name: npm audit (frontend)
        entry: npm --prefix streamlit_listview/frontend audit
        language: unsupported
        files: ^streamlit_listview/frontend/package(-lock)?\.json$
        pass_filenames: false
      # Renders every Mermaid diagram of the Markdown files, by hand: mmdc
      # starts its own Chromium. Run it with
      # pre-commit run --hook-stage manual mermaid --all-files
      - id: mermaid
        name: mermaid diagrams render (manual)
        entry: node scripts/check_mermaid.mjs
        language: node
        additional_dependencies: ["@mermaid-js/mermaid-cli@12.0.0"]
        types: [markdown]
        stages: [manual]
      # The e2e suite in Firefox and WebKit, by hand. Install the two browsers
      # once with `uv run --extra devel playwright install firefox webkit`.
      - id: e2e-browsers
        name: e2e suite in Firefox and WebKit (manual)
        entry: uv run --locked --extra devel pytest e2e/ --browser firefox --browser webkit
        language: unsupported
        pass_filenames: false
        always_run: true
        stages: [manual]
